<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Antigravity Tasks</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #3b2f7a, #12182f 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .panel {
            width: 460px;
            background: rgba(20, 24, 45, 0.85);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            padding: 28px;
            backdrop-filter: blur(8px);
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 34px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #cfd4ff;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .task-label {
            font-size: 14px;
            color: #d9ddff;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            outline: none;
        }

        input::placeholder {
            color: #bcc3ff;
        }

        .plus-btn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(139, 92, 246, 0.35);
        }

        .plus-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tabs {
            display: flex;
            gap: 18px;
            font-size: 14px;
            margin: 18px 0 14px 0;
            color: #cfd4ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 10px;
        }

        .tabs span.active {
            color: white;
            font-weight: bold;
            border-bottom: 2px solid #a78bfa;
            padding-bottom: 8px;
        }

        .result-box {
            min-height: 220px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            color: #f3f4ff;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: break-word;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
        }

        .task-card:last-child {
            margin-bottom: 0;
        }

        .helper {
            margin-top: 12px;
            font-size: 12px;
            color: #aeb6f8;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: #d9ddff;
        }
    </style>
</head>

<body>
    <div class="panel">
        <div class="title">Antigravity Tasks</div>
        <div class="subtitle">Elevate your productivity.</div>

        <div class="task-label">What needs to be done?</div>

        <div class="input-row">
            <input type="text" id="topic" placeholder="Örn: AI in education">
            <button class="plus-btn" onclick="generate()">+</button>
        </div>

        <div class="tabs">
            <span class="active">All</span>
            <span>Active</span>
            <span>Completed</span>
        </div>

        <div id="result" class="result-box">No tasks found.</div>

        <div class="helper">AI may make mistakes. Double-check generated output.</div>
    </div>

    <script>
        function formatResult(text) {
            const lines = text
                .split("\n")
                .map(line => line.trim())
                .filter(line => line !== "");

            if (lines.length === 0) {
                return "<div class='task-card'>No result.</div>";
            }

            return lines.map(line => `<div class="task-card">${line}</div>`).join("");
        }

        function generate() {
            const btn = document.querySelector(".plus-btn");
            const resultBox = document.getElementById("result");
            const topic = document.getElementById("topic").value.trim();

            btn.disabled = true;
            resultBox.innerHTML = "<div class='loading'>Yükleniyor...</div>";

            fetch("/generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ topic: topic })
            })
                .then(res => res.json())
                .then(data => {
                    resultBox.innerHTML = formatResult(data.result);
                    btn.disabled = false;
                })
                .catch(err => {
                    resultBox.innerHTML = `<div class="task-card">Hata: ${err}</div>`;
                    btn.disabled = false;
                });
        }
    </script>
</body>

</html>
