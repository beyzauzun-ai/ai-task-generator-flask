<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Tasks</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #3b2f7a, #12182f 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .panel {
            width: 90%;
            max-width: 520px;
            background: rgba(15, 18, 40, 0.75);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 42px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 28px;
            color: #cfd3ff;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        button {
            width: 52px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ff8fd8, #b66dff);
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        .results {
            margin-top: 20px;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .loading {
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="panel">
        <h1>Antigravity Tasks</h1>
        <div class="subtitle">Elevate your productivity.</div>

        <label>What needs to be done?</label>

        <div class="input-row">
            <input id="topic" placeholder="Örn: AI in education">
            <button id="btn" onclick="generate()">+</button>
        </div>

        <div id="results" class="results">
            <div class="task-card">No tasks yet</div>
        </div>
    </div>

    <script>
        async function generate() {
            const topic = document.getElementById("topic").value.trim();
            const results = document.getElementById("results");
            const btn = document.getElementById("btn");

            btn.disabled = true;

            results.innerHTML = `
                <div class="task-card">Konu: ${topic || "AI trends in 2026"}</div>
                <div class="task-card loading">Yükleniyor...</div>
            `;

            try {
                const res = await fetch("/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ topic })
                });

                const data = await res.json();

                results.innerHTML = "";

                let output = data.result || "Sonuç yok";

                results.innerHTML += `<div class="task-card"><b>Konu:</b> ${topic}</div>`;

                output.split("\n").forEach(line => {
                    if (line.trim() !== "") {
                        results.innerHTML += `<div class="task-card">${line}</div>`;
                    }
                });

            } catch (err) {
                results.innerHTML = `<div class="task-card">Hata: ${err}</div>`;
            }

            btn.disabled = false;
        }
    </script>

</body>

</html>
